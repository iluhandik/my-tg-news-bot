name: Run Telegram News Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: tg-news-bot-run
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore news and topics cache
        uses: actions/cache@v4
        with:
          path: |
            news.db
            published_topics.json
            media_hashes.json
            processed_ids.json
          key: tg-bot-cache-${{ github.run_id }}
          restore-keys: |
            tg-bot-cache-

      - name: Fast install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Run news cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          CHANNEL_NAME: ${{ secrets.CHANNEL_NAME }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          CHANNEL_INVITE_LINK: ${{ secrets.CHANNEL_INVITE_LINK }}
          AI_PROVIDER: "groq"
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: "llama-3.3-70b-versatile"
          BREAKING_NEWS_THRESHOLD: "8"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python main.py --once

      - name: Save processed news and topics to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news.db published_topics.json media_hashes.json processed_ids.json 2>/dev/null || true
          git diff-index --quiet HEAD || (git commit -m "Оновлення бази новин та тем [skip ci]" && git push) || true
